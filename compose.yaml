name: openrole
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openrole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrole_local}
      POSTGRES_DB: openrole
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrole -d openrole"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    profiles: ["backend"]
    environment:
      DATABASE_URL: postgresql://openrole:${POSTGRES_PASSWORD:-openrole_local}@postgres:5432/openrole
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build: ./backend
    profiles: ["backend"]
    environment:
      DATABASE_URL: postgresql://openrole:${POSTGRES_PASSWORD:-openrole_local}@postgres:5432/openrole
      REDIS_URL: redis://redis:6379
    depends_on:
      api: { condition: service_healthy }
    command: ["npm", "run", "worker"]
volumes:
  postgres-data:
  redis-data:
